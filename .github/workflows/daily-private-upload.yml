name: Generate and privately upload a quiz Short

on:
  schedule:
    # JST: every day, 17:00
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          # GitHub-hosted runners already have package lists. Skipping apt-get
          # update avoids an occasional network stall before every daily run.
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk ffmpeg
          pip install -r requirements.txt
      - name: Generate Short
        run: python scripts/render_quiz.py
      - name: Upload privately to YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python scripts/upload_private.py
