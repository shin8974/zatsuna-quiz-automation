name: Generate a quiz Short for manual posting

on:
  schedule:
    # JST: every day, 17:00
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-and-deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          # GitHub-hosted runners already have package lists. Skipping apt-get
          # update avoids an occasional network stall before every daily run.
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk ffmpeg
          pip install -r requirements.txt
      - name: Generate Short
        run: python scripts/render_quiz.py
      - name: Save video and posting text for download
        uses: actions/upload-artifact@v4
        with:
          name: quiz-short-${{ github.run_number }}
          path: |
            output/final.mp4
            output/metadata.txt
          if-no-files-found: error
          retention-days: 30
